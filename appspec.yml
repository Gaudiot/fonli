version: 0.0
os: linux

files:
  - source: build/app_amd64
    destination: /opt/fonli

  - source: deploy/fonli.service
    destination: /etc/systemd/system

file_exists_behavior: OVERWRITE

permissions:
  - object: /opt/fonli/app_amd64
    owner: ec2-user
    group: ec2-user
    mode: 755
    type:
      - file

hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 30
      runas: root

  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 30
      runas: root

  ApplicationStart:
    - location: scripts/application_start.sh
      timeout: 30
      runas: root

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 30
      runas: root