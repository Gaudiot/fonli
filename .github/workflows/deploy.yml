name: Deploy Fonli

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  S3_BUCKET: fonli-codedeploy-790717050053
  CODEDEPLOY_APPLICATION: fonli-api
  CODEDEPLOY_GROUP: fonli-production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          mkdir -p build

          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=amd64 \
          go build -trimpath -o build/app_amd64 .

      - name: Create deployment package
        run: |
          chmod +x build/app_amd64
          chmod +x scripts/*.sh

          zip -r deployment.zip \
            appspec.yml \
            build/app_amd64 \
            deploy/fonli.service \
            scripts/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::SEU_ACCOUNT_ID:role/GitHubFonliDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload revision to S3
        run: |
          aws s3 cp \
            deployment.zip \
            "s3://${S3_BUCKET}/revisions/${GITHUB_SHA}.zip"

      - name: Create CodeDeploy deployment
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APPLICATION" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --s3-location bucket="$S3_BUCKET",key="revisions/${GITHUB_SHA}.zip",bundleType=zip \
            --description "GitHub commit ${GITHUB_SHA}" \
            --query deploymentId \
            --output text)

          echo "Deployment: $DEPLOYMENT_ID"

          aws deploy wait deployment-successful \
            --deployment-id "$DEPLOYMENT_ID"